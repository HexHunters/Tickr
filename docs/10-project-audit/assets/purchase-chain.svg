<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="290" fill="#F8F7F4"/><text x="24" y="36" font-size="22" font-weight="700" fill="#0B0F1A" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Arial, system-ui, sans-serif">Purchase chain today — what is wired and what is not</text><text x="24" y="58" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Green = works end to end · Amber = partial · Red = broken. Each red box is a ranked blocker in the executive report.</text><rect x="24" y="96" width="150" height="120" rx="14" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/><text x="36" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">POST /orders</text><text x="36" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">creates order</text><text x="36" y="200" font-size="11" font-weight="700" fill="#B45309" text-anchor="start">partial</text><path d="M174 156 h12" stroke="#7F848F" stroke-width="2"/><rect x="186" y="96" width="150" height="120" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="198" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">reserve tickets</text><text x="198" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">[STUB] — mock ids</text><text x="198" y="200" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">C-01</text><path d="M336 156 h12" stroke="#7F848F" stroke-width="2"/><rect x="348" y="96" width="150" height="120" rx="14" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="360" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">POST /orders/:id/pay</text><text x="360" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Stripe · Konnect · Paymee</text><text x="360" y="200" font-size="11" font-weight="700" fill="#047857" text-anchor="start">real</text><path d="M498 156 h12" stroke="#7F848F" stroke-width="2"/><rect x="510" y="96" width="150" height="120" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="522" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">webhook</text><text x="522" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">Stripe: no rawBody · TN: r</text><text x="522" y="162" font-size="10" font-weight="400" fill="#374151" text-anchor="start">ef ≠ orderId</text><text x="522" y="200" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">C-02 · C-03</text><path d="M660 156 h12" stroke="#7F848F" stroke-width="2"/><rect x="672" y="96" width="150" height="120" rx="14" fill="#FEE2E2" stroke="#B91C1C" stroke-width="1.5"/><text x="684" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">confirm tickets</text><text x="684" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">order-item ids ≠ ticket id</text><text x="684" y="162" font-size="10" font-weight="400" fill="#374151" text-anchor="start">s</text><text x="684" y="200" font-size="11" font-weight="700" fill="#B91C1C" text-anchor="start">C-04</text><path d="M822 156 h12" stroke="#7F848F" stroke-width="2"/><rect x="834" y="96" width="150" height="120" rx="14" fill="#D1FAE5" stroke="#047857" stroke-width="1.5"/><text x="846" y="122" font-size="12" font-weight="700" fill="#0B0F1A" text-anchor="start">QR · check-in</text><text x="846" y="146" font-size="10" font-weight="400" fill="#374151" text-anchor="start">access · duplicate-safe</text><text x="846" y="200" font-size="11" font-weight="700" fill="#047857" text-anchor="start">real</text><text x="24" y="262" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Also: the 15-minute hold lasts ~35 h when ORDER_EXPIRATION_MINUTES is set (string concatenation, C-07) · no migration creates the payments tables (I-03) · CD cannot run (I-02).</text></svg>