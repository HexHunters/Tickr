<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="'Manrope (Google Fonts, variable wght 200–800; Latin, Latin-ext, Cyrillic, Cyrillic-ext, Greek, Vietnamese). UI/body 400–500, labels 600, font-variant-numeric: tabular-nums on every price, countdown and order reference.', Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="290" fill="#F6F1E8"/><text x="24" y="36" font-size="22" font-weight="700" fill="#1B2A35" text-anchor="start" font-family="'Fraunces (Google Fonts, variable: wght 100–900, opsz 9–144, SOFT 0–100, WONK 0–1; Latin, Latin-ext, Vietnamese). Titles at wght 600–700, opsz auto, SOFT 70 and WONK 1 above 32px; event titles on cards wght 600, opsz 18, SOFT 30.', Georgia, 'Helvetica Neue', system-ui, sans-serif">Purchase chain today — what is wired and what is not</text><text x="24" y="58" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">Green = works · Amber = partial · Red = broken. Each red box is a ranked blocker in the executive report.</text><rect x="24" y="96" width="150" height="120" rx="14" fill="#FBEEC4" stroke="#6E4E06" stroke-width="1.5"/><text x="36" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">POST /orders</text><text x="36" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">creates order</text><text x="36" y="200" font-size="11" font-weight="700" fill="#6E4E06" text-anchor="start">partial</text><path d="M174 156 h12" stroke="#707C84" stroke-width="2"/><rect x="186" y="96" width="150" height="120" rx="14" fill="#F9DBD3" stroke="#A3301F" stroke-width="1.5"/><text x="198" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">reserve tickets</text><text x="198" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">[STUB] — mock ids</text><text x="198" y="200" font-size="11" font-weight="700" fill="#A3301F" text-anchor="start">C-01</text><path d="M336 156 h12" stroke="#707C84" stroke-width="2"/><rect x="348" y="96" width="150" height="120" rx="14" fill="#D6EDE2" stroke="#146B52" stroke-width="1.5"/><text x="360" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">POST /orders/:id/pay</text><text x="360" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">Stripe · Konnect · Paymee</text><text x="360" y="200" font-size="11" font-weight="700" fill="#146B52" text-anchor="start">real</text><path d="M498 156 h12" stroke="#707C84" stroke-width="2"/><rect x="510" y="96" width="150" height="120" rx="14" fill="#F9DBD3" stroke="#A3301F" stroke-width="1.5"/><text x="522" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">webhook</text><text x="522" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">Stripe: no rawBody · TN: r</text><text x="522" y="162" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">ef ≠ orderId</text><text x="522" y="200" font-size="11" font-weight="700" fill="#A3301F" text-anchor="start">C-02 · C-03</text><path d="M660 156 h12" stroke="#707C84" stroke-width="2"/><rect x="672" y="96" width="150" height="120" rx="14" fill="#F9DBD3" stroke="#A3301F" stroke-width="1.5"/><text x="684" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">confirm tickets</text><text x="684" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">order-item ids ≠ ticket id</text><text x="684" y="162" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">s</text><text x="684" y="200" font-size="11" font-weight="700" fill="#A3301F" text-anchor="start">C-04</text><path d="M822 156 h12" stroke="#707C84" stroke-width="2"/><rect x="834" y="96" width="150" height="120" rx="14" fill="#D6EDE2" stroke="#146B52" stroke-width="1.5"/><text x="846" y="122" font-size="12" font-weight="700" fill="#1B2A35" text-anchor="start">QR · check-in</text><text x="846" y="146" font-size="10" font-weight="400" fill="#34434E" text-anchor="start">access · duplicate-safe</text><text x="846" y="200" font-size="11" font-weight="700" fill="#146B52" text-anchor="start">real</text><text x="24" y="262" font-size="11" font-weight="400" fill="#34434E" text-anchor="start">Also: the 15-minute hold lasts ~35 h when ORDER_EXPIRATION_MINUTES is set (C-07) · no migration creates the payments tables (I-03) · CD cannot run (I-02).</text></svg>