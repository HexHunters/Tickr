<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" font-family="'Manrope (Google Fonts, variable wght 200–800; Latin, Latin-ext, Cyrillic, Cyrillic-ext, Greek, Vietnamese). UI/body 400–500, labels 600, font-variant-numeric: tabular-nums on every price, countdown and order reference.', Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="320" fill="#F6F1E8"/><text x="24" y="36" font-size="22" font-weight="700" fill="#1B2A35" text-anchor="start" font-family="'Fraunces (Google Fonts, variable: wght 100–900, opsz 9–144, SOFT 0–100, WONK 0–1; Latin, Latin-ext, Vietnamese). Titles at wght 600–700, opsz auto, SOFT 70 and WONK 1 above 32px; event titles on cards wght 600, opsz 18, SOFT 30.', Georgia, 'Helvetica Neue', system-ui, sans-serif">Category tints — ten pastels, each carrying a computed ink</text><text x="24" y="58" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">Used for chips, card frames and the poster fallback; the label is always present — colour never carries the category alone.</text><rect x="24" y="80" width="180" height="96" rx="14" fill="#D3E2F1" stroke="#E2DACB"/><text x="38" y="110" font-size="15" font-weight="700" fill="#1E4A78" text-anchor="start">Concert</text><text x="38" y="132" font-size="11" font-weight="400" fill="#1E4A78" text-anchor="start" font-family="ui-monospace, Menlo, monospace">#D3E2F1</text><text x="38" y="158" font-size="11" font-weight="500" fill="#1E4A78" text-anchor="start">ink #1E4A78 · 6.90:1 AA</text><rect x="216" y="80" width="180" height="96" rx="14" fill="#D9E0D8" stroke="#E2DACB"/><text x="230" y="110" font-size="15" font-weight="700" fill="#2E434D" text-anchor="start">Conference</text><text x="230" y="132" font-size="11" font-weight="400" fill="#2E434D" text-anchor="start" font-family="ui-monospace, Menlo, monospace">#D9E0D8</text><text x="230" y="158" font-size="11" font-weight="500" fill="#2E434D" text-anchor="start">ink #2E434D · 7.70:1