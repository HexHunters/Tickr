<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="400" fill="#F8F7F4"/><text x="24" y="36" font-size="22" font-weight="700" fill="#0B0F1A" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Arial, system-ui, sans-serif">Direction — what mirrors, what does not</text><text x="24" y="58" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Logical properties only (ps-, ms-, start-, text-start). dir is set on &lt;html&gt; from the locale. Icons that imply direction are on a maintained allowlist.</text><rect x="24" y="80" width="260" height="300" rx="24" fill="#FFFFFF" stroke="#E5E3DD"/><text x="154" y="104" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">LTR · fr / en</text><path d="M48 130 l-10 8 l10 8" stroke="#2E3DE8" stroke-width="2.5" fill="none"/><text x="66" y="144" font-size="13" font-weight="500" fill="#2E3DE8" text-anchor="start">Retour</text><rect x="44" y="160" width="220" height="90" rx="12" fill="#E5E3DD"/><text x="56" y="236" font-size="13" font-weight="600" fill="#0B0F1A" text-anchor="start">Nuit Jazz à Sidi Bou Saïd</text><rect x="44" y="262" width="220" height="40" rx="12" fill="#2E3DE8"/><text x="154" y="287" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Choisir mes billets</text><rect x="44" y="312" width="140" height="18" rx="9" fill="#FFD23F"/><text x="52" y="325" font-size="10" font-weight="600" fill="#0B0F1A" text-anchor="start">Plus que 4 places</text><text x="44" y="360" font-size="11" font-weight="400" fill="#374151" text-anchor="start">◀ back chevron mirrors</text><rect x="330" y="80" width="260" height="300" rx="24" fill="#FFFFFF" stroke="#E5E3DD"/><text x="460" y="104" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">RTL · ar</text><path d="M566 130 l10 8 l-10 8" stroke="#2E3DE8" stroke-width="2.5" fill="none"/><text x="548" y="144" font-size="13" font-weight="500" fill="#2E3DE8" text-anchor="end">رجوع</text><rect x="350" y="160" width="220" height="90" rx="12" fill="#E5E3DD"/><text x="558" y="236" font-size="13" font-weight="600" fill="#0B0F1A" text-anchor="end">ليلة الجاز في سيدي بوسعيد</text><rect x="350" y="262" width="220" height="40" rx="12" fill="#2E3DE8"/><text x="460" y="287" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">اختر تذاكرك</text><rect x="430" y="312" width="140" height="18" rx="9" fill="#FFD23F"/><text x="562" y="325" font-size="10" font-weight="600" fill="#0B0F1A" text-anchor="end">بقيت 4 أماكن</text><text x="570" y="360" font-size="11" font-weight="400" fill="#374151" text-anchor="end">chevron mirrors ▶</text><rect x="636" y="80" width="340" height="300" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="656" y="108" font-size="13" font-weight="700" fill="#047857" text-anchor="start">Mirrors</text><text x="656" y="130" font-size="12" font-weight="400" fill="#374151" text-anchor="start">navigation &amp; progress arrows · back chevrons</text><text x="656" y="148" font-size="12" font-weight="400" fill="#374151" text-anchor="start">carousel direction · list bullets · sheet drag</text><text x="656" y="190" font-size="13" font-weight="700" fill="#B91C1C" text-anchor="start">Does NOT mirror</text><text x="656" y="212" font-size="12" font-weight="400" fill="#374151" text-anchor="start">clocks · play/pause · checkmarks · brand mark</text><text x="656" y="230" font-size="12" font-weight="400" fill="#374151" text-anchor="start">QR codes · photographs · numerals</text><text x="656" y="272" font-size="13" font-weight="700" fill="#2E3DE8" text-anchor="start">Bidi</text><text x="656" y="294" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Every price inside &lt;bdi&gt;; mixed strings isolated</text><text x="656" y="312" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Western digits for money, codes, timers</text><text x="656" y="350" font-size="11" font-weight="500" fill="#6B7280" text-anchor="start">QA gate: ltr/rtl × light/dark per component</text></svg>