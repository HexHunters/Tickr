<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Manrope (Google Fonts, variable wght 200–800; Latin, Latin-ext, Cyrillic, Cyrillic-ext, Greek, Vietnamese). UI/body 400–500, labels 600, font-variant-numeric: tabular-nums on every price, countdown and order reference.', Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="400" fill="#F6F1E8"/><text x="24" y="36" font-size="22" font-weight="700" fill="#1B2A35" text-anchor="start" font-family="'Fraunces (Google Fonts, variable: wght 100–900, opsz 9–144, SOFT 0–100, WONK 0–1; Latin, Latin-ext, Vietnamese). Titles at wght 600–700, opsz auto, SOFT 70 and WONK 1 above 32px; event titles on cards wght 600, opsz 18, SOFT 30.', Georgia, 'Helvetica Neue', system-ui, sans-serif">Direction — what mirrors, what does not</text><text x="24" y="58" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">Logical properties only. dir is set on &lt;html&gt; from the locale. Icons that imply direction are on an allowlist.</text><rect x="24" y="80" width="260" height="300" rx="24" fill="#FFFDF9" stroke="#E2DACB"/><text x="154" y="104" font-size="12" font-weight="600" fill="#52606A" text-anchor="middle">LTR · fr / en</text><path d="M48 130 l-10 8 l10 8" stroke="#24619A" stroke-width="2.5" fill="none"/><text x="66" y="144" font-size="13" font-weight="500" fill="#24619A" text-anchor="start">Retour</text><rect x="44" y="160" width="220" height="90" rx="14" fill="#D3E2F1"/><text x="56" y="236" font-size="13" font-weight="600" fill="#1B2A35" text-anchor="start">Nuit Jazz à Sidi Bou Saïd</text><rect x="44" y="262" width="220" height="40" rx="12" fill="#24619A"/><text x="154" y="287" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Choisir mes billets</text><rect x="44" y="312" width="140" height="18" rx="9" fill="#E8A170"/><text x="52" y="325" font-size="10" font-weight="600" fill="#1B2A35" text-anchor="start">Plus que 4 places</text><text x="44" y="360" font-size="11" font-weight="400" fill="#34434E" text-anchor="start">◀ back chevron mirrors</text><rect x="330" y="80" width="260" height="300" rx="24" fill="#FFFDF9" stroke="#E2DACB"/><text x="460" y="104" font-size="12" font-weight="600" fill="#52606A" text-anchor="middle">RTL · ar</text><path d="M566 130 l10 8 l-10 8" stroke="#24619A" stroke-width="2.5" fill="none"/><text x="548" y="144" font-size="13" font-weight="500" fill="#24619A" text-anchor="end">رجوع</text><rect x="350" y="160" width="220" height="90" rx="14" fill="#D3E2F1"/><text x="558" y="236" font-size="13" font-weight="600" fill="#1B2A35" text-anchor="end">ليلة الجاز في سيدي بوسعيد</text><rect x="350" y="262" width="220" height="40" rx="12" fill="#24619A"/><text x="460" y="287" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">اختر تذاكرك</text><rect x="430" y="312" width="140" height="18" rx="9" fill="#E8A170"/><text x="562" y="325" font-size="10" font-weight="600" fill="#1B2A35" text-anchor="end">بقيت 4 أماكن</text><text x="570" y="360" font-size="11" font-weight="400" fill="#34434E" text-anchor="end">chevron mirrors ▶</text><rect x="636" y="80" width="340" height="300" rx="16" fill="#FFFDF9" stroke="#E2DACB"/><text x="656" y="108" font-size="13" font-weight="700" fill="#146B52" text-anchor="start">Mirrors</text><text x="656" y="130" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">navigation &amp; progress arrows · back chevrons</text><text x="656" y="148" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">carousel direction · list bullets · sheet drag</text><text x="656" y="190" font-size="13" font-weight="700" fill="#A3301F" text-anchor="start">Does NOT mirror</text><text x="656" y="212" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">clocks · play/pause · checkmarks · brand mark</text><text x="656" y="230" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">QR codes · photographs · numerals</text><text x="656" y="272" font-size="13" font-weight="700" fill="#24619A" text-anchor="start">Bidi</text><text x="656" y="294" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">Every price inside &lt;bdi&gt;; mixed strings isolated</text><text x="656" y="312" font-size="12" font-weight="400" fill="#34434E" text-anchor="start">Western digits for money, codes, timers</text><text x="656" y="350" font-size="11" font-weight="500" fill="#52606A" text-anchor="start">QA gate: ltr/rtl × light/dark per component</text></svg>