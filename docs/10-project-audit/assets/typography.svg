<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="400" fill="#F8F7F4"/><text x="24" y="36" font-size="22" font-weight="700" fill="#0B0F1A" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Arial, system-ui, sans-serif">Typography — script-complete stack</text><text x="24" y="58" font-size="12" font-weight="400" fill="#374151" text-anchor="start">Two families per active script, subset by unicode-range. (Rendered here with system fallbacks; labels name the intended face.)</text><rect x="24" y="76" width="460" height="300" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="44" y="102" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">LATIN · CYRILLIC · GREEK</text><text x="44" y="150" font-size="36" font-weight="700" fill="#0B0F1A" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Arial, system-ui, sans-serif" letter-spacing="-0.7">Nuit Jazz à Sidi Bou Saïd</text><text x="44" y="176" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Display — Archivo 700 · tracking −2 %</text><text x="44" y="214" font-size="16" font-weight="400" fill="#374151" text-anchor="start">Vendredi 12 septembre, 21:00 · Villa Sebastian, Hammamet</text><text x="44" y="236" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">UI / body — Inter 400 · 16 px / 24</text><text x="44" y="280" font-size="22" font-weight="600" fill="#0B0F1A" text-anchor="start" font-family="ui-monospace, Menlo, monospace">Total à payer     106,000 DT</text><text x="44" y="302" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Money — tabular-nums, always; millimes only when non-zero</text><text x="44" y="340" font-size="15" font-weight="400" fill="#374151" text-anchor="start">Cyrillic Ночь джаза · Greek Βραδιά τζαζ</text><text x="44" y="362" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Inter covers both; Archivo covers Latin-Extended</text><rect x="516" y="76" width="460" height="300" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="536" y="102" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">ARABIC (RTL) · HEBREW</text><text x="956" y="150" font-size="34" font-weight="700" fill="#0B0F1A" text-anchor="end" direction="rtl">ليلة الجاز في سيدي بوسعيد</text><text x="956" y="176" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">Display — Cairo 700 · tracking 0 (never negative)</text><text x="956" y="214" font-size="16" font-weight="400" fill="#374151" text-anchor="end" direction="rtl">الجمعة 12 سبتمبر، 21:00 · فيلا سيباستيان، الحمامات</text><text x="956" y="236" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">UI / body — IBM Plex Sans Arabic 400 · 17 px / 1.7</text><text x="956" y="280" font-size="22" font-weight="600" fill="#0B0F1A" text-anchor="end" font-family="ui-monospace, Menlo, monospace" direction="rtl">106,000 DT     المجموع</text><text x="956" y="302" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">Western digits for money, codes and timers in every locale</text><text x="956" y="340" font-size="15" font-weight="400" fill="#374151" text-anchor="end" direction="rtl">עברית — Heebo 700 / 400</text><text x="956" y="362" font-size="12" font-weight="400" fill="#6B7280" text-anchor="end">Universal fallback: Noto Sans &lt;Script&gt; → system-ui</text></svg>