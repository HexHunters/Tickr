<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"><rect width="1000" height="400" fill="#F8F7F4"/><text x="24" y="36" font-size="22" font-weight="700" fill="#0B0F1A" text-anchor="start" font-family="Archivo, 'Helvetica Neue', Arial, system-ui, sans-serif">Market activation — configure, never fork</text><text x="24" y="58" font-size="12" font-weight="400" fill="#374151" text-anchor="start">One design system. A market is a typed config + translated strings + a provider order. Resolved from URL/domain, never IP alone.</text><rect x="24" y="84" width="300" height="290" rx="16" fill="#0B0F1A"/><text x="44" y="110" font-size="14" font-weight="700" fill="#FFD23F" text-anchor="start">Global design system</text><text x="44" y="138" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• poster-first gallery</text><text x="44" y="162" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• cobalt = sole action colour</text><text x="44" y="186" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• warm neutrals + dark theme</text><text x="44" y="210" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• 5 UX principles</text><text x="44" y="234" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• script-complete type stack</text><text x="44" y="258" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• accent slot (4 values)</text><text x="44" y="282" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• logical properties · RTL</text><text x="44" y="306" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• Intl money &amp; time</text><text x="44" y="330" font-size="12" font-weight="400" fill="#E8E6E1" text-anchor="start">• WCAG 2.2 AA</text><rect x="360" y="84" width="196" height="290" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="376" y="110" font-size="13" font-weight="700" fill="#2E3DE8" text-anchor="start">TN — Tunisia</text><text x="376" y="140" font-size="11" font-weight="400" fill="#374151" text-anchor="start">fr-TN · ar-TN</text><text x="376" y="170" font-size="11" font-weight="400" fill="#374151" text-anchor="start">TND · 3 minor units</text><text x="376" y="200" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Africa/Tunis · h23</text><text x="376" y="230" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Konnect → Paymee → Stripe</text><text x="376" y="260" font-size="11" font-weight="400" fill="#374151" text-anchor="start">accent: sun</text><text x="376" y="290" font-size="11" font-weight="400" fill="#374151" text-anchor="start">+216 · first-last</text><path d="M324 230 h28" stroke="#7F848F" stroke-width="2"/><path d="M346 224 l6 6 l-6 6" stroke="#7F848F" stroke-width="2" fill="none"/><rect x="570" y="84" width="196" height="290" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="586" y="110" font-size="13" font-weight="700" fill="#2E3DE8" text-anchor="start">FR — France</text><text x="586" y="140" font-size="11" font-weight="400" fill="#374151" text-anchor="start">fr-FR · en-GB</text><text x="586" y="170" font-size="11" font-weight="400" fill="#374151" text-anchor="start">EUR · 2 minor units</text><text x="586" y="200" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Europe/Paris · h23</text><text x="586" y="230" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Stripe (cards, Apple/Google Pay)</text><text x="586" y="260" font-size="11" font-weight="400" fill="#374151" text-anchor="start">accent: sun</text><text x="586" y="290" font-size="11" font-weight="400" fill="#374151" text-anchor="start">+33 · first-last</text><path d="M534 230 h28" stroke="#7F848F" stroke-width="2"/><path d="M556 224 l6 6 l-6 6" stroke="#7F848F" stroke-width="2" fill="none"/><rect x="780" y="84" width="196" height="290" rx="16" fill="#FFFFFF" stroke="#E5E3DD"/><text x="796" y="110" font-size="13" font-weight="700" fill="#2E3DE8" text-anchor="start">next market</text><text x="796" y="140" font-size="11" font-weight="400" fill="#374151" text-anchor="start">locales[]</text><text x="796" y="170" font-size="11" font-weight="400" fill="#374151" text-anchor="start">currency</text><text x="796" y="200" font-size="11" font-weight="400" fill="#374151" text-anchor="start">timeZone · hourCycle</text><text x="796" y="230" font-size="11" font-weight="400" fill="#374151" text-anchor="start">paymentOrder[] (local first)</text><text x="796" y="260" font-size="11" font-weight="400" fill="#374151" text-anchor="start">accent slot</text><text x="796" y="290" font-size="11" font-weight="400" fill="#374151" text-anchor="start">phone · nameShape · legal · tax</text><path d="M744 230 h28" stroke="#7F848F" stroke-width="2"/><path d="M766 224 l6 6 l-6 6" stroke="#7F848F" stroke-width="2" fill="none"/></svg>