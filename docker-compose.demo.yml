# Isolated local data for frontend development; no production services.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tickr_demo
      POSTGRES_USER: tickr_demo
      POSTGRES_PASSWORD: tickr_demo
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tickr_demo -d tickr_demo']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:56380:6379'
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    # Shares the postgres network namespace so 127.0.0.1 is loopback, as the demo-target guard requires.
    network_mode: 'service:postgres'
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
    command: ['npm', 'run', 'seed:demo']
    healthcheck:
      disable: true
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      target: development
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ENDPOINT: http://host.docker.internal:4566
      AWS_S3_ENDPOINT: http://host.docker.internal:4566
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: ['sh', '-c', 'npm run build && npm run start:demo']
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fs http://localhost:3000/api/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 180s
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_started
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_INTERNAL_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: http://backend:3000
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo_postgres:
